<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .error {
            background: #ffe0e0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #c00;
        }
        .success {
            background: #e0ffe0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #0c0;
        }
    </style>
</head>
<body>
    <h1>Chat Widget Test Page</h1>
    
    <div class="info">
        <h2>Instructions</h2>
        <p>This page tests if the chat widget loads correctly.</p>
        <p>Check the browser console (F12) for detailed logs.</p>
    </div>
    
    <div id="status" class="info">
        <h2>Status</h2>
        <p>Loading widget script...</p>
    </div>
    
    <script>
        // Test script loading
        const statusDiv = document.getElementById('status');
        const agentId = '3f75ab81-4244-4b6c-960d-5c9632c846a0';
        const scriptUrl = `https://ai-multi-tenant-saas-git-obfuscation-tindeveloper.vercel.app/api/widget/chat.js?agent_id=${agentId}`;
        
        console.log('[Test Page] Loading widget script from:', scriptUrl);
        
        const script = document.createElement('script');
        script.src = scriptUrl;
        script.type = 'text/javascript';
        script.async = true;
        
        script.onload = function() {
            console.log('[Test Page] Script loaded successfully');
            statusDiv.className = 'success';
            statusDiv.innerHTML = '<h2>✅ Script Loaded</h2><p>The widget script loaded successfully. Check the console for widget initialization logs.</p>';
            
            // Check if widget button exists after a delay
            setTimeout(() => {
                const button = document.getElementById('chat-widget-button');
                if (button) {
                    statusDiv.innerHTML += '<p>✅ Widget button found in DOM!</p>';
                } else {
                    statusDiv.innerHTML += '<p>⚠️ Widget button not found in DOM. Check console for errors.</p>';
                }
            }, 2000);
        };
        
        script.onerror = function(error) {
            console.error('[Test Page] Script failed to load:', error);
            statusDiv.className = 'error';
            statusDiv.innerHTML = '<h2>❌ Script Failed to Load</h2><p>The widget script could not be loaded. Check the browser console and network tab for errors.</p>';
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
